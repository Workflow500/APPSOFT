# Legen unter  .github/workflows/ingest.yml  im Repo ab.
# Vorher in den Repo-Einstellungen unter Secrets den Wert
# ANTHROPIC_API_KEY hinterlegen.

name: Airsoft Events aktualisieren

on:
  schedule:
    # Einmal taeglich um 04:00 UTC. Das sind 06:00 deutscher Sommerzeit
    # bzw. 05:00 im Winter, der Abgleich ist also vor dem Tag fertig.
    # Cron laeuft bei GitHub immer in UTC, deshalb keine Zeitumstellung.
    - cron: "0 4 * * *"
  workflow_dispatch: {}       # zusaetzlich jederzeit manuell ausloesbar

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Events einlesen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node ingest.mjs

      - name: events.json committen, falls geaendert
        run: |
          if ! git diff --quiet events.json .ingest-cache.json; then
            git config user.name "airsoft-bot"
            git config user.email "bot@users.noreply.github.com"
            git add events.json .ingest-cache.json
            git commit -m "Events aktualisiert"
            git push
          else
            echo "Keine Aenderung"
          fi
